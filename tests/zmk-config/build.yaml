include:
  - artifact: kscan_diagnostics_board_feature_disabled
    board: xiao_ble//zmk
    shield: tester_xiao

  - artifact: kscan_diagnostics_board_with_rpc
    board: xiao_ble//zmk
    shield: tester_xiao
    # CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256: see the BUILD_ASSERT arithmetic
    # comment in src/studio/kscan_diagnostics_handler.c.
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_KSCAN_DIAGNOSTICS=y -DCONFIG_ZMK_KSCAN_DIAGNOSTICS_STUDIO_RPC=y -DCONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256
    snippet: studio-rpc-usb-uart

